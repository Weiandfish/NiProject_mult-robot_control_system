<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>校园机器人控制台</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
<header><strong>校园机器人控制台</strong><span id="scope">正在连接</span><span id="counts" role="status"></span></header>
<main>
  <section class="mapPane" aria-label="机器人地图">
    <div class="mapBar"><b id="mapName">地图</b><span id="mapInfo"></span>
      <div class="zoom"><button id="zoomOut" title="缩小">−</button><button id="zoomIn" title="放大">＋</button><button id="fit">全图</button></div>
    </div>
    <canvas id="map" aria-label="地图，拖动平移、滚轮缩放；点击可选目标坐标"></canvas>
    <div class="mapBar"><span id="cursor">拖动平移 · 滚轮缩放 · 点击取坐标</span><span>● 实时位置　○ 最后位置</span></div>
  </section>
  <aside>
    <section><h2>机器人</h2><div id="robots">等待设备状态</div></section>
    <section><h2>指令 <small id="selection">未选中</small></h2>
      <dl id="detail"></dl>
      <div class="buttonRow"><button data-cmd="ping" disabled>通信探测</button><button data-cmd="status" disabled>读取状态</button></div>
      <div class="coordinate">
        <label>X / m<input id="x" type="number" step=".01"></label>
        <label>Y / m<input id="y" type="number" step=".01"></label>
        <label>朝向 / °<input id="yaw" type="number" min="-180" max="180" value="0"></label>
      </div>
      <div class="buttonRow"><button data-cmd="seed_pose" disabled>设初始位姿</button><button data-cmd="preview_path" disabled>预览路线</button></div>
      <p id="notice" role="status">点选机器人后可操作。路线预览不驱动底盘。</p>
    </section>
    <section class="logPane"><h2>指令回执</h2><ol id="jobs"></ol></section>
  </aside>
</main>
</body>
</html>
